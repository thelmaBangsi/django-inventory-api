<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory & User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Inventory Dashboard</h2>
        <div>
            <button class="btn btn-outline-primary me-2" data-bs-toggle="modal" data-bs-target="#authModal">User Auth / Account</button>
            <button class="btn btn-primary" onclick="clearForm()" data-bs-toggle="modal" data-bs-target="#itemModal">+ Add Item</button>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Quantity</th>
                        <th>Unit Price ($)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in items %}
                    <tr>
                        <td>{{ item.id }}</td>
                        <td>{{ item.name }}</td>
                        <td>{{ item.quantity }}</td>
                        <td>{{ item.price }}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-secondary" onclick="editItem('{{ item.id }}', '{{ item.name }}', '{{ item.quantity }}', '{{ item.price }}')">Edit</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteItem('{{ item.id }}')">Delete</button>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" class="text-center py-4 text-muted">No items found in inventory.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="itemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="itemModalTitle">Add Inventory Item</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="itemId">
                <div class="mb-3">
                    <label class="form-label">Item Name</label>
                    <input type="text" class="form-control" id="itemName" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="number" class="form-control" id="itemQuantity" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Unit Price ($)</label>
                    <input type="number" step="0.01" class="form-control" id="itemPrice" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" onclick="saveItem()">Save Item</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="authModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Account & User Management</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <ul class="nav nav-tabs mb-3" id="authTabs" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button">Login</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button">Register</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="update-tab" data-bs-toggle="tab" data-bs-target="#update" type="button">Update Profile</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="reset-tab" data-bs-toggle="tab" data-bs-target="#reset" type="button">Forgot Pwd</button>
                    </li>
                </ul>

                <div class="tab-content" id="authTabsContent">
                    <div class="tab-pane fade show active" id="login">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="loginUser">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPass">
                        </div>
                        <button class="btn btn-primary w-100" onclick="handleLogin()">Log In</button>
                    </div>

                    <div class="tab-pane fade" id="register">
                        <div class="mb-2">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-control" id="regUser">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" id="regFirstName">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="regEmail">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" id="regPass">
                        </div>
                        <button class="btn btn-success w-100" onclick="handleRegister()">Register Account</button>
                    </div>

                    <div class="tab-pane fade" id="update">
                        <div class="mb-2">
                            <label class="form-label">Target Username</label>
                            <input type="text" class="form-control" id="updateTargetUser">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">New First Name</label>
                            <input type="text" class="form-control" id="updateFirstName">
                        </div>
                        <hr>
                        <div class="mb-2">
                            <label class="form-label">Old Password (Optional)</label>
                            <input type="password" class="form-control" id="updateOldPass">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Password (Optional)</label>
                            <input type="password" class="form-control" id="updateNewPass">
                        </div>
                        <button class="btn btn-warning w-100" onclick="handleUpdateProfile()">Update Profile / Password</button>
                    </div>

                    <div class="tab-pane fade" id="reset">
                        <div class="mb-2">
                            <label class="form-label">Username or Email</label>
                            <input type="text" class="form-control" id="resetIdentifier">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" id="resetNewPass">
                        </div>
                        <button class="btn btn-danger w-100" onclick="handleForgotPassword()">Reset Password</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const itemModal = new bootstrap.Modal(document.getElementById('itemModal'));

    function clearForm() {
        document.getElementById('itemModalTitle').innerText = 'Add Inventory Item';
        document.getElementById('itemId').value = '';
        document.getElementById('itemName').value = '';
        document.getElementById('itemQuantity').value = '';
        document.getElementById('itemPrice').value = '';
    }

    function editItem(id, name, quantity, price) {
        document.getElementById('itemModalTitle').innerText = 'Edit Inventory Item';
        document.getElementById('itemId').value = id;
        document.getElementById('itemName').value = name;
        document.getElementById('itemQuantity').value = quantity;
        document.getElementById('itemPrice').value = price;
        itemModal.show();
    }

    async function saveItem() {
        const id = document.getElementById('itemId').value;
        const name = document.getElementById('itemName').value;
        const quantity = document.getElementById('itemQuantity').value;
        const price = document.getElementById('itemPrice').value;

        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/v1/items/${id}/` : '/api/v1/items/';

        const res = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, quantity, price })
        });

        if (res.ok) {
            location.reload();
        } else {
            const err = await res.json();
            alert('Error: ' + JSON.stringify(err));
        }
    }

    async function deleteItem(id) {
        if (!confirm('Are you sure you want to delete this item?')) return;
        const res = await fetch(`/api/v1/items/${id}/`, { method: 'DELETE' });
        if (res.ok) location.reload();
    }

    // --- AUTH FUNCTIONS ---

    async function handleLogin() {
        const username = document.getElementById('loginUser').value;
        const password = document.getElementById('loginPass').value;

        const res = await fetch('/api/v1/auth/login/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
            alert('Welcome ' + data.user.username + '! Login successful.');
        } else {
            alert('Login failed: ' + (data.error || JSON.stringify(data)));
        }
    }

    async function handleRegister() {
        const username = document.getElementById('regUser').value;
        const first_name = document.getElementById('regFirstName').value;
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPass').value;

        const res = await fetch('/api/v1/auth/register/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, first_name, email, password })
        });

        const data = await res.json();
        if (res.ok) {
            alert('User registered successfully!');
        } else {
            alert('Registration error: ' + JSON.stringify(data));
        }
    }

    async function handleUpdateProfile() {
        const targetUser = document.getElementById('updateTargetUser').value;
        const first_name = document.getElementById('updateFirstName').value;
        const old_password = document.getElementById('updateOldPass').value;
        const new_password = document.getElementById('updateNewPass').value;

        if (!targetUser) {
            alert('Please enter the User ID to update.');
            return;
        }

        const payload = {};
        if (first_name) payload.first_name = first_name;
        if (old_password && new_password) {
            payload.old_password = old_password;
            payload.new_password = new_password;
        }

        const res = await fetch(`/api/v1/auth/profile/${targetUser}/`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok) {
            alert('Profile updated successfully!');
        } else {
            alert('Update error: ' + JSON.stringify(data));
        }
    }

    async function handleForgotPassword() {
        const identifier = document.getElementById('resetIdentifier').value;
        const new_password = document.getElementById('resetNewPass').value;

        const res = await fetch('/api/v1/auth/forgot-password/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username_or_email: identifier, new_password })
        });

        const data = await res.json();
        if (res.ok) {
            alert(data.message);
        } else {
            alert('Reset error: ' + JSON.stringify(data));
        }
    }
</script>
</body>
</html>
