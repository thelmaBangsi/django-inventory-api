<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; }
        .badge-admin { background: #d9534f; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .badge-user { background: #5bc0de; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .form-container { background: #f9f9f9; padding: 15px; border-radius: 5px; margin-bottom: 20px; width: 300px; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Add New User</h2>
    <div class="form-container">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="newUsername" required>
        </div>
        <div class="form-group">
            <label>First Name</label>
            <input type="text" id="newFirstName">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="newEmail">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="newPassword" required>
        </div>
        <div class="form-group">
            <label>Role / Position</label>
            <select id="newIsStaff">
                <option value="false">Regular User</option>
                <option value="true">Admin / Staff</option>
            </select>
        </div>
        <button onclick="addUser()">Create User</button>
    </div>

    <h2>Registered Users</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>First Name</th>
                <th>Email</th>
                <th>Role / Position</th>
            </tr>
        </thead>
        <tbody id="userTableBody">
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.first_name }}</td>
                <td>{{ user.email }}</td>
                <td>
                    {% if user.is_superuser %}
                        <span class="badge-admin">Super Admin</span>
                    {% elif user.is_staff %}
                        <span class="badge-admin">Admin / Staff</span>
                    {% else %}
                        <span class="badge-user">User</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <script>
        async function addUser() {
            const username = document.getElementById('newUsername').value;
            const first_name = document.getElementById('newFirstName').value;
            const email = document.getElementById('newEmail').value;
            const password = document.getElementById('newPassword').value;
            const is_staff = document.getElementById('newIsStaff').value === 'true';

            if (!username || !password) {
                alert('Username and password are required.');
                return;
            }

            const response = await fetch('/users/create/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, first_name, email, password, is_staff })
            });

            const data = await response.json();
            if (response.ok) {
                alert('User created successfully!');
                location.reload();
            } else {
                alert('Error: ' + JSON.stringify(data));
            }
        }
    </script>
</body>
</html>
